name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true
        default: '1.0.0'

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Android app files
        run: |
          mkdir -p android_build
          cp android_app/main.py android_build/
          cp android_app/buildozer.spec android_build/
          cp -r my_xxt android_build/
          cp config.py android_build/
          mkdir -p android_build/img
          cp img/cover.jpg android_build/img/ 2>/dev/null || echo "cover.jpg not found"
          cp img/img_3.png android_build/img/ 2>/dev/null || echo "img_3.png not found"
          mkdir -p android_build/answers
          touch android_build/answers/.gitkeep
          touch android_build/my_xxt/__init__.py

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore android_build/xxtdocx.keystore \
            -alias xxtdocx \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass xxtdocx2024 -keypass xxtdocx2024 \
            -dname "CN=liuwanwan1, OU=Dev, O=XxtDocx, L=Beijing, ST=Beijing, C=CN"

      - name: Build APK with Buildozer
        run: |
          cd android_build
          buildozer -v android release
        timeout-minutes: 45

      - name: Sign and align APK
        run: |
          cd android_build
          UNSIGNED_APK=$(find bin -name "*release-unsigned*.apk" 2>/dev/null | head -1)
          if [ -z "$UNSIGNED_APK" ]; then
            UNSIGNED_APK=$(find bin -name "*.apk" 2>/dev/null | head -1)
          fi
          if [ -n "$UNSIGNED_APK" ]; then
            echo "Found APK: $UNSIGNED_APK"
            SIGNED_APK="xxt-docx-exporter-v1.0.0.apk"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore xxtdocx.keystore \
              -storepass xxtdocx2024 -keypass xxtdocx2024 \
              "$UNSIGNED_APK" xxtdocx
            ZIPALIGN=$(find / -name "zipalign" -type f 2>/dev/null | head -1)
            if [ -n "$ZIPALIGN" ]; then
              "$ZIPALIGN" -v 4 "$UNSIGNED_APK" "$SIGNED_APK"
            else
              cp "$UNSIGNED_APK" "$SIGNED_APK"
            fi
            echo "APK_SIZE=$(stat -c%s "$SIGNED_APK")" >> $GITHUB_ENV
            ls -lh "$SIGNED_APK"
          else
            echo "ERROR: No APK found"
            find . -name "*.apk" 2>/dev/null
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xxt-docx-exporter-apk
          path: android_build/xxt-docx-exporter-v1.0.0.apk
          retention-days: 30
          compression-level: 0

      - name: Create Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "v1.0.0 - 学习通作业提取工具"
          body: |
            # 📚 学习通作业提取工具 v1.0.0
            ## 📱 Android APK 下载
            下载 `xxt-docx-exporter-v1.0.0.apk` 安装到安卓手机即可使用。
            ### 功能特性
            - 🔐 手机号/密码登录 & 扫码登录
            - 📋 查看所有课程和作业列表
            - 🕷️ 一键爬取已完成作业的答案
            - 📄 导出为格式化Word文档(docx)
            - 📦 支持批量导出（独立/合并模式）
            - 🎨 精美封面页、彩色题型标签、正确答案高亮
            ### 安装说明
            1. 下载 APK 文件到手机
            2. 允许"安装未知来源应用"
            3. 安装后打开应用
            4. 登录学习通账号即可使用
            ### ⚠️ 注意
            - 仅供学习交流使用
            - 需允许网络访问权限
            ---
            🤖 Built with GitHub Actions
          files: android_build/xxt-docx-exporter-v1.0.0.apk
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
